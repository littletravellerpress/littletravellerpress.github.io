<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Traveller World</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mansalva&family=Schoolbell&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#121212;
      --accent:#3a7b5c;
    }
    html,body{
      height:100%;
      margin:0;
      background:#fff;
      color:var(--ink);
      font-family:"Schoolbell", system-ui, -apple-system, Arial, sans-serif;
    }

    /* Page layout: footer pinned to bottom, content centered nicely */
    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      position:relative;           /* for owl/rabbit positioning */
    }
    .content{
      max-width:820px;
      width:100%;
      margin:0 auto;
      padding:18px 16px 32px;
    }

    /* Top hero (boy) */
    .hero{
      width:min(540px,92vw);
      margin:8px auto 0;
      border-radius:14px;
      box-shadow:0 12px 40px rgba(0,0,0,.08);
      display:block;
    }

    /* Title & intro */
    h1{
      font-family:"Mansalva", cursive;
      font-size:clamp(48px,10vw,86px);
      line-height:1;
      text-align:center;
      margin:10px 0 6px;
      letter-spacing:.5px;
    }
    .intro{
      max-width:700px;
      margin:8px auto 22px;
      text-align:center;
      font-size:clamp(18px,2.8vw,22px);
      line-height:1.55;
    }

    /* Shelf centered and big */
    .shelf{
      display:block;
      width:min(520px,86vw);
      margin:12px auto 6px; /* smaller bottom gap so button sits closer */
      height:auto;
    }

    /* CTA tightly under the shelf */
    .cta-wrap{ text-align:center; margin-top: 2px; }
    .cta{
      display:inline-block;
      padding:12px 30px;
      background:#fff;
      color:var(--ink);
      border:2.5px solid #222;
      border-radius:999px;
      font-weight:700;
      font-size:clamp(18px,2.8vw,24px);
      text-decoration:none;
      box-shadow:0 6px 20px rgba(0,0,0,.06);
      transition:transform .05s ease;
    }
    .cta:hover{ transform:translateY(-1px); }

    /* Spacer pushes footer to bottom to keep shelf near page middle */
    .spacer{ flex:1; }
