<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Little Traveller World</title>
  <meta name="description" content="Explore new stories, learn new things, and meet real friends. Stay curious and kind.">
  <link rel="canonical" href="https://littletravellerpress.com/">

  <!-- Social preview (uses social-card.png in your repo root) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Little Traveller World">
  <meta property="og:description" content="Explore new stories, learn new things, and meet real friends. Stay curious and kind.">
  <meta property="og:url" content="https://littletravellerpress.com/">
  <meta property="og:image" content="https://littletravellerpress.com/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Little Traveller World — boy explorer with owl and rabbit">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Little Traveller World">
  <meta name="twitter:description" content="Explore new stories, learn new things, and meet new friends.">
  <meta name="twitter:image" content="https://littletravellerpress.com/social-card.png">

  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">

  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <!-- Keep the filename that exists in your repo -->
  <link rel="stylesheet" href="style-2.css?v=5">
</head>
<body>
  <main class="page">
    <!-- Hero -->
    <img src="hero-boy.png" alt="Little Traveller" class="hero">

    <!-- Title -->
    <h1>Little Traveller World</h1>

    <!-- Intro -->
    <p class="intro">
      Welcome to the World of Little Traveller, Fellow Explorer!<br>
      Here you can find new stories, learn about new things and meet real friends.<br>
      <strong>Stay curious and kind!</strong>
    </p>

    <!-- Shelf -->
    <img src="books-shelf.png" alt="Bookshelf" class="bookshelf">

    <!-- Button -->
    <a class="btn"
       href="https://www.amazon.com/Firefly-Owl-Little-Traveler-Luciérnaga/dp/B0FBTH3V2Y"
       target="_blank" rel="noopener noreferrer">
      Explore Stories
    </a>

    <!-- Decorations -->
    <img src="owl.png" alt="Owl" class="owl">
    <img src="rabbit.png" alt="Rabbit" class="rabbit">

    <!-- Footer -->
    <footer>© Little Traveller Press, 2025</footer>
  </main>
  <!-- TEST: Butterfly (standalone) -->
<style>
  .butterfly-test {
    position: fixed;
    left: -120px;
    top: 55vh;
    width: 100px;
    pointer-events: none;
    z-index: 99999;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.25));
    animation:
      butterfly-path 18s linear infinite,
      butterfly-tilt  0.6s ease-in-out infinite;
  }
  @keyframes butterfly-path {
    0%   { transform: translate(0, 0) rotate(0deg); }
    20%  { transform: translate(25vw, -8vh) rotate(8deg); }
    40%  { transform: translate(50vw,  6vh) rotate(-6deg); }
    60%  { transform: translate(75vw, -10vh) rotate(10deg); }
    85%  { transform: translate(100vw, -4vh) rotate(-4deg); }
    100% { transform: translate(115vw, 0) rotate(0deg); }
  }
  @keyframes butterfly-tilt {
    0%,100% { transform-origin: 50% 50%; }
    50%     { transform-origin: 50% 50%; transform: scaleX(0.95) rotate(2deg); }
  }
  /* Force show even if user prefers-reduced-motion (for testing only) */
  @media (prefers-reduced-motion: reduce) {
    .butterfly-test { animation: butterfly-path 18s linear infinite !important; }
  }
  /* Hide on small screens */
  @media (max-width: 768px) {
    .butterfly-test { display: none; }
  }
</style>

<img src="butterfly.png?v=2" alt="" class="butterfly-test" aria-hidden="true">


</body>
</html>
