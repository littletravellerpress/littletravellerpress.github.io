<title>Thank You — Little Traveller Press</title>

<link href="https://fonts.googleapis.com/css2?family=Arapey:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night-0:#060f24;
    --night-1:#0b1b3a;
    --night-2:#16285a;
    --moon:#F3EEDD;
    --firefly:#E8BD4E;
    --firefly-soft:#f0cc70;
    --star:#D9E2F4;
    --mist:#92A2C6;
    --line:rgba(160,180,220,.16);
    --serif:"Arapey", Georgia, serif;
    --sans:"Inter", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(600px 400px at 20% 10%, rgba(232,189,78,.05), transparent 60%),
      radial-gradient(700px 500px at 85% 90%, rgba(146,162,198,.06), transparent 65%),
      linear-gradient(180deg, var(--night-0), var(--night-1));
    font-family:var(--sans);color:var(--star);padding:24px;
    position:relative;overflow:hidden;
  }
  .stars{position:absolute;inset:0;pointer-events:none;}
  .stars span{position:absolute;width:2px;height:2px;background:var(--star);border-radius:50%;opacity:.5;
    box-shadow:0 0 6px 1px rgba(217,226,244,.6);animation:tw 4s ease-in-out infinite;}
  .stars span.gold{background:var(--firefly-soft);box-shadow:0 0 8px 2px rgba(232,189,78,.6);}
  @keyframes tw{0%,100%{opacity:.2;}50%{opacity:.9;}}
  .card{
    position:relative;z-index:1;max-width:480px;width:100%;text-align:center;
    padding:52px 40px;border:1px solid var(--line);border-radius:20px;
    background:linear-gradient(180deg, rgba(146,162,198,.09), rgba(11,27,58,.55) 40%, rgba(6,15,36,.75));
    backdrop-filter:blur(6px);
    box-shadow:0 0 60px -10px rgba(217,226,244,.08), 0 30px 60px -20px rgba(0,0,0,.5);
  }

  .moon{
    width:92px;height:92px;border-radius:50%;margin:0 auto 24px;position:relative;overflow:hidden;
    box-shadow:0 0 46px 12px rgba(220,190,140,.28), 0 0 90px 26px rgba(220,190,140,.1);
  }
  .moon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}

  h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,4.6vw,34px);color:var(--moon);margin:0 0 16px;line-height:1.22;}
  p{color:var(--mist);line-height:1.65;font-size:16px;margin:0 0 10px;}
  .fine{font-family:var(--mono);font-size:12px;color:var(--firefly-soft);letter-spacing:.02em;margin-top:22px;}
  a.home{display:inline-block;margin-top:26px;font-family:var(--mono);font-size:13px;letter-spacing:.03em;
    color:var(--firefly);border:1px solid var(--line);border-radius:2px;padding:12px 22px;text-decoration:none;
    transition:background .2s,color .2s,box-shadow .3s;}
  a.home:hover{background:var(--firefly-soft);color:#10203f;box-shadow:0 0 24px 4px rgba(232,189,78,.55);}

  /* Desktop-only: larger card, matching the reference proportions */
  @media(min-width:900px){
    .card{max-width:760px;padding:80px 88px;border-radius:26px;}
    .moon{width:132px;height:132px;margin:0 auto 34px;}
    h1{font-size:44px;margin:0 0 22px;}
    p{font-size:19px;line-height:1.7;margin:0 0 14px;}
    .fine{font-size:14px;margin-top:28px;}
    a.home{font-size:15px;padding:15px 30px;margin-top:32px;}
  }
  @media(min-width:1280px){
    .card{max-width:880px;padding:96px 104px;}
    .moon{width:150px;height:150px;}
    h1{font-size:50px;}
    p{font-size:20px;}
  }

  .dust{
    position:fixed;pointer-events:none;z-index:999;
    top:0;left:0;
    will-change:transform,opacity;
    animation:dustDrift var(--dur) ease-out forwards;
  }
  .dust.dot{
    width:var(--size);height:var(--size);border-radius:50%;
    background:radial-gradient(circle, var(--c1) 0%, var(--c2) 55%, transparent 75%);
  }
  .dust.star{
    width:var(--size);height:var(--size);
    background:var(--c1);
    clip-path:polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
    box-shadow:0 0 6px 1px var(--c1);
  }
  @keyframes dustDrift{
    0%{ opacity:1; transform:translate(0,0) scale(1) rotate(0deg); }
    100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(.15) rotate(var(--rot)); }
  }

  @media (prefers-reduced-motion: reduce){
    .stars span{animation:none;opacity:.5;}
    .dust{display:none;}
  }
</style>

  <script>
    var s=document.getElementById('stars'),n=40;
    for(var i=0;i<n;i++){
      var d=document.createElement('span');
      if(i%6===0) d.className='gold';
      d.style.left=Math.random()*100+'%';
      d.style.top=Math.random()*100+'%';
      d.style.animationDelay=(Math.random()*4)+'s';
      s.appendChild(d);
    }
  </script>

  <script>
  (function(){
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    var palette = [
      ['#fff6da', '#f0cc70'],  // warm gold
      ['#f7ecff', '#c9a8f0'],  // soft lavender
      ['#eaf1ff', '#a9c4f5'],  // pale starlight blue
      ['#fff2e0', '#e8bd4e']   // firefly gold
    ];

    var lastSpark = 0;
    document.addEventListener('mousemove', function(e){
      var now = Date.now();
      if(now - lastSpark < 26) return;
      lastSpark = now;

      var count = 1 + Math.floor(Math.random()*2); // 1-2 particles per tick
      for (var i=0; i<count; i++){
        spawnDust(e.clientX, e.clientY);
      }
    });

    function spawnDust(x, y){
      var el = document.createElement('div');
      var isStar = Math.random() < 0.35;
      el.className = 'dust ' + (isStar ? 'star' : 'dot');

      var colors = palette[Math.floor(Math.random()*palette.length)];
      var size = isStar ? (5 + Math.random()*4) : (3 + Math.random()*4);
      var angle = Math.random()*Math.PI*2;
      var dist = 14 + Math.random()*26;
      var dx = Math.cos(angle)*dist;
      var dy = Math.sin(angle)*dist - (10 + Math.random()*14); // gentle upward drift, like dust caught in air
      var dur = 550 + Math.random()*450;
      var rot = (Math.random()*140 - 70) + 'deg';

      el.style.setProperty('--size', size+'px');
      el.style.setProperty('--c1', colors[0]);
      el.style.setProperty('--c2', colors[1]);
      el.style.setProperty('--dx', dx+'px');
      el.style.setProperty('--dy', dy+'px');
      el.style.setProperty('--dur', dur+'ms');
      el.style.setProperty('--rot', rot);
      el.style.left = (x + (Math.random()*10-5) - size/2) + 'px';
      el.style.top  = (y + (Math.random()*10-5) - size/2) + 'px';

      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, dur + 50);
    }
  })();
  </script>
